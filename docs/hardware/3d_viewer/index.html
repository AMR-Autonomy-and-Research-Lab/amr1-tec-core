<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visor 3D de PCB — AMR1-TEC-CORE</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0b1121; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; overflow: hidden; }
        canvas { display: block; }

        #overlay {
            position: absolute; inset: 0;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            background: rgba(11, 17, 33, 0.92);
            z-index: 10; transition: opacity 0.6s ease;
            padding: 20px;
        }
        #overlay.hidden { opacity: 0; pointer-events: none; }

        .spinner {
            width: 52px; height: 52px; border-radius: 50%;
            border: 3px solid rgba(0, 240, 255, 0.15);
            border-top-color: #00f0ff;
            animation: spin 0.9s linear infinite;
            margin-bottom: 24px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        #status-text {
            color: #e2e8f0; font-size: 15px; font-weight: 500;
            text-align: center; margin-bottom: 12px;
            max-width: 480px; line-height: 1.5;
        }
        #status-sub {
            color: #64748b; font-size: 12px; font-family: monospace;
            text-align: center; margin-bottom: 18px;
            max-width: 520px; word-break: break-all;
        }
        #progress-bar-wrap {
            width: 320px; height: 4px; background: rgba(255,255,255,0.08);
            border-radius: 4px; overflow: hidden; margin-bottom: 10px;
        }
        #progress-bar {
            height: 100%; background: #00f0ff; width: 0%;
            transition: width 0.3s ease; border-radius: 4px;
        }
        #progress-label {
            color: #475569; font-size: 11px; font-family: monospace;
        }

        #error-box {
            display: none; background: rgba(255, 50, 50, 0.1);
            border: 1px solid rgba(255, 50, 50, 0.4);
            border-radius: 8px; padding: 16px 20px;
            max-width: 520px; margin-top: 12px;
        }
        #error-box p { color: #f87171; font-size: 13px; line-height: 1.6; }
        #error-box code { color: #fca5a5; font-family: monospace; font-size: 11px; word-break: break-all; }
        #retry-btn {
            margin-top: 14px; padding: 8px 20px;
            background: transparent; border: 1px solid #00f0ff;
            color: #00f0ff; border-radius: 6px; cursor: pointer;
            font-size: 13px; transition: background 0.2s;
        }
        #retry-btn:hover { background: rgba(0, 240, 255, 0.1); }

        #hud {
            position: absolute; top: 18px; width: 100%;
            text-align: center; pointer-events: none; z-index: 5;
        }
        #hud h2 {
            color: #00f0ff; font-size: 15px; font-weight: 600;
            text-shadow: 0 0 12px rgba(0, 240, 255, 0.5);
        }
        #hud p { color: #64748b; font-size: 11px; margin-top: 4px; }
    </style>
</head>
<body>

<div id="hud">
    <h2>AMR1-TEC-CORE &mdash; Visor 3D de PCB</h2>
    <p>Clic + arrastrar para rotar &nbsp;·&nbsp; Rueda del ratón para zoom &nbsp;·&nbsp; Clic derecho para desplazar</p>
</div>

<div id="overlay">
    <div class="spinner" id="spinner"></div>
    <div id="status-text">Iniciando visor 3D...</div>
    <div id="status-sub"></div>
    <div id="progress-bar-wrap">
        <div id="progress-bar"></div>
    </div>
    <div id="progress-label"></div>
    <div id="error-box">
        <p id="error-msg"></p>
        <br/>
        <p style="color:#94a3b8; font-size:12px;">Intenta abrir la consola del navegador (F12) para ver más detalles.</p>
        <button id="retry-btn" onclick="location.reload()">Reintentar</button>
    </div>
</div>

<script type="module">
// ─── Imports directos sin importmap (más compatible con htmlpreview) ───────────
import * as THREE from 'https://unpkg.com/three@0.160.0/build/three.module.js';
import { OrbitControls } from 'https://unpkg.com/three@0.160.0/examples/jsm/controls/OrbitControls.js';
import { GLTFLoader }    from 'https://unpkg.com/three@0.160.0/examples/jsm/loaders/GLTFLoader.js';

// ─── UI helpers ───────────────────────────────────────────────────────────────
const $status  = document.getElementById('status-text');
const $sub     = document.getElementById('status-sub');
const $bar     = document.getElementById('progress-bar');
const $label   = document.getElementById('progress-label');
const $spinner = document.getElementById('spinner');
const $errBox  = document.getElementById('error-box');
const $errMsg  = document.getElementById('error-msg');
const $overlay = document.getElementById('overlay');

function setStatus(msg, sub = '') {
    $status.textContent = msg;
    $sub.textContent = sub;
}
function setProgress(pct, label = '') {
    $bar.style.width = pct + '%';
    $label.textContent = label;
}
function showError(msg) {
    $spinner.style.display  = 'none';
    $bar.parentElement.style.display = 'none';
    $label.style.display    = 'none';
    $errBox.style.display   = 'block';
    $errMsg.innerHTML = msg;
    console.error('[3D Viewer]', msg);
}
function hideOverlay() {
    $overlay.classList.add('hidden');
    setTimeout(() => $overlay.style.display = 'none', 700);
}

// ─── THREE.js setup ───────────────────────────────────────────────────────────
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.insertBefore(renderer.domElement, document.body.firstChild);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0b1121);

const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.001, 5000);
camera.position.set(0, 10, 20);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.07;
controls.autoRotate = true;
controls.autoRotateSpeed = 1.5;
controls.minDistance = 0.5;
controls.maxDistance = 2000;

// ─── Lighting ─────────────────────────────────────────────────────────────────
scene.add(new THREE.AmbientLight(0xffffff, 0.5));

const hemi = new THREE.HemisphereLight(0xd4eaff, 0x0f1e38, 0.6);
scene.add(hemi);

const sun = new THREE.DirectionalLight(0xffffff, 2.0);
sun.position.set(30, 80, 50);
sun.castShadow = true;
sun.shadow.mapSize.setScalar(2048);
scene.add(sun);

const fill = new THREE.DirectionalLight(0x8888ff, 0.5);
fill.position.set(-30, 10, -20);
scene.add(fill);

const bluePoint = new THREE.PointLight(0x00aaff, 4, 500);
bluePoint.position.set(-60, 30, 60);
scene.add(bluePoint);

const pinkPoint = new THREE.PointLight(0xff0055, 2, 500);
pinkPoint.position.set(60, 50, -60);
scene.add(pinkPoint);

// ─── Ground plane ─────────────────────────────────────────────────────────────
const groundGeo = new THREE.PlaneGeometry(2000, 2000);
const groundMat = new THREE.MeshStandardMaterial({
    color: 0x0d1828, roughness: 0.8, metalness: 0.1,
    transparent: true, opacity: 0.6,
});
const ground = new THREE.Mesh(groundGeo, groundMat);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

// ─── Grid helper ──────────────────────────────────────────────────────────────
const grid = new THREE.GridHelper(400, 40, 0x003344, 0x001a22);
grid.material.transparent = true;
grid.material.opacity = 0.4;
scene.add(grid);

// ─── GLB loading with multi-CDN fallback + progress ───────────────────────────
const GLB_SOURCES = [
    {
        label: 'jsDelivr CDN',
        url: 'https://cdn.jsdelivr.net/gh/AMR-Autonomy-and-Research-Lab/amr1-tec-core@main/3D_Models/PCB_3D/PCB_Final.glb',
    },
    {
        label: 'GitHub Raw',
        url: 'https://raw.githubusercontent.com/AMR-Autonomy-and-Research-Lab/amr1-tec-core/main/3D_Models/PCB_3D/PCB_Final.glb',
    },
];

async function fetchWithProgress(url, sourceLabel) {
    setStatus(`Conectando — ${sourceLabel}`, url);
    setProgress(0, 'Conectando...');

    const response = await fetch(url);
    if (!response.ok) throw new Error(`HTTP ${response.status} ${response.statusText}`);

    const total = parseInt(response.headers.get('Content-Length') || '0', 10);
    const reader = response.body.getReader();
    const chunks = [];
    let received = 0;

    while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        chunks.push(value);
        received += value.length;
        if (total > 0) {
            const pct = Math.round((received / total) * 100);
            const mb  = (received / 1048576).toFixed(1);
            const tot = (total   / 1048576).toFixed(1);
            setStatus(`Descargando modelo 3D... ${pct}%`);
            setProgress(pct, `${mb} MB / ${tot} MB`);
        } else {
            const mb = (received / 1048576).toFixed(1);
            setStatus(`Descargando modelo 3D...`, `${mb} MB recibidos`);
            setProgress(50);
        }
    }

    // Concatenate chunks
    const buffer = new Uint8Array(received);
    let offset = 0;
    for (const chunk of chunks) { buffer.set(chunk, offset); offset += chunk.length; }
    return buffer.buffer;
}

async function parseGLB(arrayBuffer) {
    return new Promise((resolve, reject) => {
        new GLTFLoader().parse(arrayBuffer, '', resolve, reject);
    });
}

async function loadModel() {
    let lastError = null;

    for (const source of GLB_SOURCES) {
        try {
            console.log(`[3D Viewer] Trying source: ${source.label} — ${source.url}`);
            const buffer = await fetchWithProgress(source.url, source.label);

            setStatus('Procesando geometría...');
            setProgress(98, 'Decodificando...');
            const gltf = await parseGLB(buffer);
            return gltf.scene;

        } catch (err) {
            console.warn(`[3D Viewer] Source failed (${source.label}):`, err);
            lastError = err;
        }
    }

    throw new Error(`Todos los orígenes fallaron. Último error: ${lastError?.message || lastError}`);
}

function applyPCBMaterials(model) {
    model.traverse((child) => {
        if (!child.isMesh || !child.material) return;
        const mat = child.material;
        mat.side = THREE.DoubleSide;
        child.castShadow    = true;
        child.receiveShadow = true;

        const { r, g, b } = mat.color;

        if (g > r && g > b && g > 0.3) {          // Verde — máscara de soldadura
            mat.roughness = 0.15; mat.metalness = 0.05;
        } else if (r < 0.2 && g < 0.2 && b < 0.2) { // Negro — chips / plástico
            mat.roughness = 0.55; mat.metalness = 0.0;
        } else if (r > 0.5 && g > 0.5 && b > 0.5) {  // Gris/blanco — metal / serigrafía
            mat.roughness = 0.25; mat.metalness = 0.85;
        } else if (r > 0.6 && g < 0.5 && b < 0.3) {  // Cobre/naranja — pines / pads
            mat.roughness = 0.3;  mat.metalness = 0.9;
        } else {
            mat.roughness = 0.5; mat.metalness = 0.1;
        }
    });
}

function fitCameraToModel(model) {
    const box    = new THREE.Box3().setFromObject(model);
    const center = box.getCenter(new THREE.Vector3());
    const size   = box.getSize(new THREE.Vector3());
    const maxDim = Math.max(size.x, size.y, size.z);

    // Center model at origin
    model.position.sub(center);

    // Position ground and grid under model
    const bottom = box.min.y - center.y;
    ground.position.y = bottom - 0.01;
    grid.position.y   = bottom - 0.005;

    // Fit camera
    const fovRad = camera.fov * (Math.PI / 180);
    const dist   = (maxDim / (2 * Math.tan(fovRad / 2))) * 2.0;

    camera.position.set(dist * 0.6, dist * 0.5, dist * 0.9);
    camera.near = dist * 0.001;
    camera.far  = dist * 20;
    camera.updateProjectionMatrix();

    controls.target.set(0, 0, 0);
    controls.maxDistance = dist * 8;
    controls.update();
}

// ─── Main ─────────────────────────────────────────────────────────────────────
(async () => {
    try {
        const model = await loadModel();

        setStatus('Aplicando materiales...');
        setProgress(99);

        // EasyEDA exports are usually Z-up; rotate to Y-up
        model.rotation.x = -Math.PI / 2;

        scene.add(model);
        fitCameraToModel(model);

        setProgress(100, 'Listo');
        hideOverlay();

        console.log('[3D Viewer] Model loaded successfully.');
    } catch (err) {
        showError(
            `<strong>No se pudo cargar el modelo 3D.</strong><br/><br/>` +
            `<code>${err.message}</code><br/><br/>` +
            `Verifica tu conexión a internet y que el repositorio sea público.`
        );
    }
})();

// ─── Render loop ──────────────────────────────────────────────────────────────
(function animate() {
    requestAnimationFrame(animate);
    controls.update();
    renderer.render(scene, camera);
})();

// ─── Resize handler ───────────────────────────────────────────────────────────
window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
