<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visor 3D de PCB — AMR1-TEC-CORE</title>

    <!-- Three.js r128 como scripts globales UMD (sin type=module, sin importmap)
         Esto evita que htmlpreview.github.io bloquee los imports via CSP -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://unpkg.com/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://unpkg.com/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0b1121; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; overflow: hidden; }
        canvas { display: block; }

        #overlay {
            position: absolute; inset: 0;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            background: rgba(11, 17, 33, 0.92);
            z-index: 10; transition: opacity 0.6s ease;
            padding: 20px;
        }
        #overlay.fade-out { opacity: 0; pointer-events: none; }

        .spinner {
            width: 52px; height: 52px; border-radius: 50%;
            border: 3px solid rgba(0, 240, 255, 0.15);
            border-top-color: #00f0ff;
            animation: spin 0.9s linear infinite;
            margin-bottom: 24px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        #status-text {
            color: #e2e8f0; font-size: 15px; font-weight: 500;
            text-align: center; margin-bottom: 8px; max-width: 480px; line-height: 1.5;
        }
        #status-sub {
            color: #64748b; font-size: 11px; font-family: monospace;
            text-align: center; margin-bottom: 18px; max-width: 520px; word-break: break-all;
        }
        #prog-wrap {
            width: 320px; height: 4px; background: rgba(255,255,255,0.08);
            border-radius: 4px; overflow: hidden; margin-bottom: 8px;
        }
        #prog-bar { height: 100%; background: #00f0ff; width: 0%; transition: width 0.25s ease; }
        #prog-label { color: #475569; font-size: 11px; font-family: monospace; }

        #err-box {
            display: none; background: rgba(255,50,50,0.1);
            border: 1px solid rgba(255,50,50,0.4); border-radius: 8px;
            padding: 16px 20px; max-width: 520px; margin-top: 16px; text-align: left;
        }
        #err-box p { color: #f87171; font-size: 13px; line-height: 1.6; }
        #err-box code { color: #fca5a5; font-family: monospace; font-size: 11px; word-break: break-all; }
        #err-box small { color: #94a3b8; font-size: 11px; }
        #retry-btn {
            display: inline-block; margin-top: 12px; padding: 7px 18px;
            background: transparent; border: 1px solid #00f0ff;
            color: #00f0ff; border-radius: 6px; cursor: pointer; font-size: 13px;
        }
        #retry-btn:hover { background: rgba(0,240,255,0.1); }

        #hud {
            position: absolute; top: 16px; width: 100%;
            text-align: center; pointer-events: none; z-index: 5;
        }
        #hud h2 { color: #00f0ff; font-size: 14px; font-weight: 600; text-shadow: 0 0 10px rgba(0,240,255,0.4); }
        #hud p  { color: #475569; font-size: 11px; margin-top: 4px; }
    </style>
</head>
<body>

<div id="hud">
    <h2>AMR1-TEC-CORE &mdash; Visor 3D de PCB</h2>
    <p>Clic + arrastrar: rotar &nbsp;·&nbsp; Rueda: zoom &nbsp;·&nbsp; Clic derecho: desplazar</p>
</div>

<div id="overlay">
    <div class="spinner" id="spinner"></div>
    <div id="status-text">Cargando librerías 3D...</div>
    <div id="status-sub"></div>
    <div id="prog-wrap"><div id="prog-bar"></div></div>
    <div id="prog-label"></div>
    <div id="err-box">
        <p id="err-msg">Error desconocido.</p>
        <br>
        <small>Abre la consola del navegador (F12 → Console) para más detalles.</small>
        <br>
        <button id="retry-btn" onclick="location.reload()">&#8635; Reintentar</button>
    </div>
</div>

<!-- Script regular (sin type="module") para máxima compatibilidad con htmlpreview -->
<script>
(function () {
    'use strict';

    // ── UI helpers ──────────────────────────────────────────────────────────
    var elStatus = document.getElementById('status-text');
    var elSub    = document.getElementById('status-sub');
    var elBar    = document.getElementById('prog-bar');
    var elLabel  = document.getElementById('prog-label');
    var elErr    = document.getElementById('err-box');
    var elErrMsg = document.getElementById('err-msg');
    var elSpinner = document.getElementById('spinner');
    var elOverlay = document.getElementById('overlay');

    function setStatus(msg, sub) {
        elStatus.textContent = msg;
        elSub.textContent    = sub || '';
    }
    function setProgress(pct, label) {
        elBar.style.width    = Math.min(pct, 100) + '%';
        elLabel.textContent  = label || '';
    }
    function showError(html) {
        elSpinner.style.display          = 'none';
        document.getElementById('prog-wrap').style.display = 'none';
        elLabel.style.display            = 'none';
        elErr.style.display              = 'block';
        elErrMsg.innerHTML               = html;
        console.error('[3D Viewer] Error:', html.replace(/<[^>]+>/g, ' '));
    }
    function hideOverlay() {
        elOverlay.classList.add('fade-out');
        setTimeout(function () { elOverlay.style.display = 'none'; }, 700);
    }

    // ── Sanity check: THREE must be loaded ─────────────────────────────────
    if (typeof THREE === 'undefined') {
        showError(
            '<strong>Three.js no se pudo cargar.</strong><br>' +
            'Comprueba tu conexión a internet e intenta de nuevo.'
        );
        return;
    }
    if (!THREE.GLTFLoader) {
        showError(
            '<strong>GLTFLoader no se pudo cargar.</strong><br>' +
            'Comprueba tu conexión a internet e intenta de nuevo.'
        );
        return;
    }

    // ── Renderer ────────────────────────────────────────────────────────────
    var renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.outputEncoding = THREE.sRGBEncoding;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.body.insertBefore(renderer.domElement, document.body.firstChild);

    // ── Scene & Camera ──────────────────────────────────────────────────────
    var scene  = new THREE.Scene();
    scene.background = new THREE.Color(0x0b1121);

    var camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.001, 5000);
    camera.position.set(0, 10, 20);

    // ── Controls ────────────────────────────────────────────────────────────
    var controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping   = true;
    controls.dampingFactor   = 0.07;
    controls.autoRotate      = true;
    controls.autoRotateSpeed = 1.5;
    controls.minDistance     = 0.1;
    controls.maxDistance     = 2000;

    // ── Lighting ────────────────────────────────────────────────────────────
    scene.add(new THREE.AmbientLight(0xffffff, 0.5));

    var hemi = new THREE.HemisphereLight(0xd4eaff, 0x0f1e38, 0.6);
    scene.add(hemi);

    var sun = new THREE.DirectionalLight(0xffffff, 2.0);
    sun.position.set(30, 80, 50);
    sun.castShadow = true;
    sun.shadow.mapSize.set(2048, 2048);
    scene.add(sun);

    var fill = new THREE.DirectionalLight(0x8888ff, 0.5);
    fill.position.set(-30, 10, -20);
    scene.add(fill);

    var bluePoint = new THREE.PointLight(0x00aaff, 4, 500);
    bluePoint.position.set(-60, 30, 60);
    scene.add(bluePoint);

    var pinkPoint = new THREE.PointLight(0xff0055, 2, 500);
    pinkPoint.position.set(60, 50, -60);
    scene.add(pinkPoint);

    // ── Ground + Grid ───────────────────────────────────────────────────────
    var ground = new THREE.Mesh(
        new THREE.PlaneGeometry(2000, 2000),
        new THREE.MeshStandardMaterial({ color: 0x0d1828, roughness: 0.8, transparent: true, opacity: 0.6 })
    );
    ground.rotation.x = -Math.PI / 2;
    ground.receiveShadow = true;
    scene.add(ground);

    var grid = new THREE.GridHelper(400, 40, 0x003344, 0x001a22);
    grid.material.transparent = true;
    grid.material.opacity = 0.4;
    scene.add(grid);

    // ── GLB sources ─────────────────────────────────────────────────────────
    var GLB_SOURCES = [
        {
            label: 'jsDelivr CDN',
            url:   'https://cdn.jsdelivr.net/gh/AMR-Autonomy-and-Research-Lab/amr1-tec-core@main/3D_Models/PCB_3D/PCB_Final.glb'
        },
        {
            label: 'GitHub Raw',
            url:   'https://raw.githubusercontent.com/AMR-Autonomy-and-Research-Lab/amr1-tec-core/main/3D_Models/PCB_3D/PCB_Final.glb'
        }
    ];

    // ── XHR with progress ───────────────────────────────────────────────────
    function fetchGLB(source, onSuccess, onFail) {
        setStatus('Conectando — ' + source.label, source.url);
        setProgress(0, 'Conectando...');
        console.log('[3D Viewer] Trying: ' + source.url);

        var xhr = new XMLHttpRequest();
        xhr.open('GET', source.url, true);
        xhr.responseType = 'arraybuffer';

        xhr.onprogress = function (e) {
            if (e.lengthComputable) {
                var pct = Math.round(e.loaded / e.total * 100);
                var mb  = (e.loaded  / 1048576).toFixed(1);
                var tot = (e.total   / 1048576).toFixed(1);
                setStatus('Descargando modelo 3D... ' + pct + '%');
                setProgress(pct, mb + ' MB / ' + tot + ' MB');
            } else {
                var mb2 = (e.loaded / 1048576).toFixed(1);
                setStatus('Descargando modelo 3D...', mb2 + ' MB recibidos');
                setProgress(50);
            }
        };

        xhr.onload = function () {
            if (xhr.status === 200) {
                onSuccess(xhr.response);
            } else {
                onFail(new Error('HTTP ' + xhr.status + ' de ' + source.label));
            }
        };

        xhr.onerror = function () {
            onFail(new Error('Error de red al contactar ' + source.label));
        };

        xhr.ontimeout = function () {
            onFail(new Error('Timeout al contactar ' + source.label));
        };

        xhr.timeout = 60000; // 60 segundos
        xhr.send();
    }

    // ── Try sources in order ────────────────────────────────────────────────
    var currentSource = 0;

    function tryNextSource() {
        if (currentSource >= GLB_SOURCES.length) {
            showError(
                '<strong>No se pudo cargar el modelo desde ningún servidor.</strong><br><br>' +
                'Posibles causas:<br>' +
                '&bull; Sin conexión a internet<br>' +
                '&bull; El repositorio de GitHub es privado<br>' +
                '&bull; Los CDN están caídos temporalmente<br><br>' +
                '<small>Intenta recargar la página en unos segundos.</small>'
            );
            return;
        }

        var source = GLB_SOURCES[currentSource];
        fetchGLB(
            source,
            function (buffer) { parseAndShow(buffer); },
            function (err) {
                console.warn('[3D Viewer] Source failed:', err.message);
                currentSource++;
                if (currentSource < GLB_SOURCES.length) {
                    setStatus('Reintentando con fuente alternativa...', err.message);
                    setTimeout(tryNextSource, 800);
                } else {
                    tryNextSource(); // trigger error screen
                }
            }
        );
    }

    // ── Parse GLB & show ────────────────────────────────────────────────────
    function parseAndShow(buffer) {
        setStatus('Procesando geometría...');
        setProgress(98, 'Decodificando...');

        var loader = new THREE.GLTFLoader();
        loader.parse(buffer, '',
            function (gltf) {
                setProgress(100, 'Listo');
                var model = gltf.scene;

                // Apply PBR material hints by color
                model.traverse(function (child) {
                    if (!child.isMesh || !child.material) return;
                    var mat = child.material;
                    mat.side = THREE.DoubleSide;
                    child.castShadow = child.receiveShadow = true;
                    var r = mat.color.r, g = mat.color.g, b = mat.color.b;
                    if (g > r && g > b && g > 0.3) {           // Verde - solder mask
                        mat.roughness = 0.15; mat.metalness = 0.05;
                    } else if (r < 0.2 && g < 0.2 && b < 0.2) { // Negro - chips
                        mat.roughness = 0.55; mat.metalness = 0.0;
                    } else if (r > 0.5 && g > 0.5 && b > 0.5) { // Gris - metal
                        mat.roughness = 0.25; mat.metalness = 0.85;
                    } else if (r > 0.6 && g < 0.5 && b < 0.3) { // Cobre
                        mat.roughness = 0.3;  mat.metalness = 0.9;
                    } else {
                        mat.roughness = 0.5; mat.metalness = 0.1;
                    }
                    mat.needsUpdate = true;
                });

                // EasyEDA exports Z-up → rotate to Y-up
                model.rotation.x = -Math.PI / 2;
                scene.add(model);

                // Fit camera after rotation
                var box    = new THREE.Box3().setFromObject(model);
                var center = box.getCenter(new THREE.Vector3());
                var size   = box.getSize(new THREE.Vector3());
                var maxDim = Math.max(size.x, size.y, size.z);

                model.position.sub(center);

                var fovRad = camera.fov * Math.PI / 180;
                var dist   = (maxDim / (2 * Math.tan(fovRad / 2))) * 2.2;

                camera.near = dist * 0.001;
                camera.far  = dist * 20;
                camera.position.set(dist * 0.6, dist * 0.5, dist * 0.9);
                camera.updateProjectionMatrix();

                controls.target.set(0, 0, 0);
                controls.maxDistance = dist * 8;
                controls.update();

                ground.position.y = (box.min.y - center.y) - 0.01;
                grid.position.y   = ground.position.y + 0.005;

                hideOverlay();
                console.log('[3D Viewer] Model loaded. Size:', size);
            },
            function (err) {
                showError(
                    '<strong>Error al decodificar el modelo GLB.</strong><br><br>' +
                    '<code>' + (err.message || err) + '</code>'
                );
            }
        );
    }

    // ── Render loop ─────────────────────────────────────────────────────────
    (function animate() {
        requestAnimationFrame(animate);
        controls.update();
        renderer.render(scene, camera);
    })();

    // ── Resize ──────────────────────────────────────────────────────────────
    window.addEventListener('resize', function () {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // ── Start loading ───────────────────────────────────────────────────────
    setStatus('Conectando al servidor...');
    tryNextSource();

})();
</script>
</body>
</html>
