<svg xmlns="http://www.w3.org/2000/svg" width="900" height="480" viewBox="0 0 900 480">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0b1121"/>
      <stop offset="100%" style="stop-color:#0f1a2e"/>
    </linearGradient>
    <linearGradient id="board" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a4a3a"/>
      <stop offset="100%" style="stop-color:#0f3028"/>
    </linearGradient>
    <linearGradient id="glow_blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00f0ff;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#00f0ff;stop-opacity:0"/>
    </linearGradient>
    <linearGradient id="glow_pink" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ff0055;stop-opacity:0.1"/>
      <stop offset="100%" style="stop-color:#ff0055;stop-opacity:0"/>
    </linearGradient>
    <filter id="blur_soft">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000" flood-opacity="0.6"/>
    </filter>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="480" fill="url(#bg)"/>
  <rect width="900" height="480" fill="url(#glow_blue)"/>
  <rect width="900" height="480" fill="url(#glow_pink)"/>

  <!-- Grid lines -->
  <g stroke="#1a2a3a" stroke-width="1" opacity="0.5">
    <line x1="0" y1="60" x2="900" y2="60"/>
    <line x1="0" y1="120" x2="900" y2="120"/>
    <line x1="0" y1="180" x2="900" y2="180"/>
    <line x1="0" y1="240" x2="900" y2="240"/>
    <line x1="0" y1="300" x2="900" y2="300"/>
    <line x1="0" y1="360" x2="900" y2="360"/>
    <line x1="0" y1="420" x2="900" y2="420"/>
    <line x1="90" y1="0" x2="90" y2="480"/>
    <line x1="180" y1="0" x2="180" y2="480"/>
    <line x1="270" y1="0" x2="270" y2="480"/>
    <line x1="360" y1="0" x2="360" y2="480"/>
    <line x1="450" y1="0" x2="450" y2="480"/>
    <line x1="540" y1="0" x2="540" y2="480"/>
    <line x1="630" y1="0" x2="630" y2="480"/>
    <line x1="720" y1="0" x2="720" y2="480"/>
    <line x1="810" y1="0" x2="810" y2="480"/>
  </g>

  <!-- PCB Board isometric shape -->
  <g filter="url(#shadow)">
    <!-- Board base (green PCB) -->
    <polygon points="300,80 620,80 700,180 700,380 380,380 300,280" fill="url(#board)" stroke="#2a6a50" stroke-width="1.5"/>
    <!-- Board top face -->
    <polygon points="300,80 620,80 620,280 300,280" fill="#1d5540" stroke="#2a7a5a" stroke-width="1"/>
    <!-- Board right side -->
    <polygon points="620,80 700,180 700,380 620,280" fill="#0f3020" stroke="#1a5030" stroke-width="1"/>
    <!-- Board bottom side -->
    <polygon points="300,280 620,280 700,380 380,380" fill="#0a2518" stroke="#15402a" stroke-width="1"/>
  </g>

  <!-- PCB copper traces (top face) -->
  <g opacity="0.6">
    <line x1="340" y1="130" x2="580" y2="130" stroke="#b87333" stroke-width="2"/>
    <line x1="340" y1="150" x2="580" y2="150" stroke="#b87333" stroke-width="1.5"/>
    <line x1="340" y1="200" x2="500" y2="200" stroke="#b87333" stroke-width="2"/>
    <line x1="400" y1="130" x2="400" y2="250" stroke="#b87333" stroke-width="1.5"/>
    <line x1="480" y1="130" x2="480" y2="200" stroke="#b87333" stroke-width="2"/>
    <line x1="550" y1="130" x2="550" y2="240" stroke="#b87333" stroke-width="1.5"/>
    <line x1="340" y1="250" x2="560" y2="250" stroke="#b87333" stroke-width="1.5"/>
  </g>

  <!-- Solder pads -->
  <g fill="#c8922a" opacity="0.8">
    <circle cx="340" cy="130" r="5"/>
    <circle cx="340" cy="150" r="4"/>
    <circle cx="340" cy="200" r="5"/>
    <circle cx="480" cy="200" r="4"/>
    <circle cx="580" cy="130" r="5"/>
    <circle cx="560" cy="250" r="4"/>
    <circle cx="550" cy="240" r="5"/>
  </g>

  <!-- IC chip 1 (large) -->
  <rect x="420" y="155" width="70" height="60" rx="3" fill="#111" stroke="#333" stroke-width="1"/>
  <g fill="#555" opacity="0.7">
    <rect x="415" y="165" width="6" height="4" rx="1"/>
    <rect x="415" y="175" width="6" height="4" rx="1"/>
    <rect x="415" y="185" width="6" height="4" rx="1"/>
    <rect x="415" y="195" width="6" height="4" rx="1"/>
    <rect x="489" y="165" width="6" height="4" rx="1"/>
    <rect x="489" y="175" width="6" height="4" rx="1"/>
    <rect x="489" y="185" width="6" height="4" rx="1"/>
    <rect x="489" y="195" width="6" height="4" rx="1"/>
    <rect x="430" y="150" width="4" height="6" rx="1"/>
    <rect x="445" y="150" width="4" height="6" rx="1"/>
    <rect x="460" y="150" width="4" height="6" rx="1"/>
    <rect x="430" y="214" width="4" height="6" rx="1"/>
    <rect x="445" y="214" width="4" height="6" rx="1"/>
    <rect x="460" y="214" width="4" height="6" rx="1"/>
  </g>
  <circle cx="427" cy="162" r="3" fill="#222"/>

  <!-- Capacitors -->
  <rect x="360" y="165" width="16" height="24" rx="8" fill="#1a3a6a" stroke="#2a5a9a" stroke-width="1"/>
  <rect x="382" y="165" width="16" height="24" rx="8" fill="#1a3a6a" stroke="#2a5a9a" stroke-width="1"/>
  <line x1="368" y1="163" x2="368" y2="160" stroke="#888" stroke-width="1.5"/>
  <line x1="390" y1="163" x2="390" y2="160" stroke="#888" stroke-width="1.5"/>

  <!-- Resistors -->
  <rect x="350" y="230" width="22" height="10" rx="3" fill="#c8b08a" stroke="#9a8060" stroke-width="0.5"/>
  <rect x="378" y="230" width="22" height="10" rx="3" fill="#c88a8a" stroke="#9a6060" stroke-width="0.5"/>
  <rect x="406" y="230" width="22" height="10" rx="3" fill="#c8c88a" stroke="#9a9a60" stroke-width="0.5"/>
  <line x1="350" y1="235" x2="348" y2="235" stroke="#888" stroke-width="1.5"/>
  <line x1="372" y1="235" x2="374" y2="235" stroke="#888" stroke-width="1.5"/>

  <!-- Connector header -->
  <rect x="540" y="155" width="32" height="56" rx="2" fill="#222" stroke="#444" stroke-width="1"/>
  <g fill="#888">
    <rect x="544" y="160" width="10" height="8" rx="1"/>
    <rect x="544" y="172" width="10" height="8" rx="1"/>
    <rect x="544" y="184" width="10" height="8" rx="1"/>
    <rect x="544" y="196" width="10" height="8" rx="1"/>
    <rect x="558" y="160" width="10" height="8" rx="1"/>
    <rect x="558" y="172" width="10" height="8" rx="1"/>
    <rect x="558" y="184" width="10" height="8" rx="1"/>
    <rect x="558" y="196" width="10" height="8" rx="1"/>
  </g>

  <!-- Mounting holes -->
  <circle cx="315" cy="95" r="7" fill="#0a2518" stroke="#2a7a5a" stroke-width="1.5"/>
  <circle cx="315" cy="95" r="3" fill="#0b1121"/>
  <circle cx="605" cy="95" r="7" fill="#0a2518" stroke="#2a7a5a" stroke-width="1.5"/>
  <circle cx="605" cy="95" r="3" fill="#0b1121"/>
  <circle cx="315" cy="265" r="7" fill="#0a2518" stroke="#2a7a5a" stroke-width="1.5"/>
  <circle cx="315" cy="265" r="3" fill="#0b1121"/>
  <circle cx="605" cy="265" r="7" fill="#0a2518" stroke="#2a7a5a" stroke-width="1.5"/>
  <circle cx="605" cy="265" r="3" fill="#0b1121"/>

  <!-- Glow effects -->
  <circle cx="280" cy="160" r="60" fill="#00f0ff" opacity="0.04" filter="url(#blur_soft)"/>
  <circle cx="680" cy="200" r="80" fill="#ff0055" opacity="0.04" filter="url(#blur_soft)"/>

  <!-- Right side text panel -->
  <g>
    <!-- Label: AMR1-TEC-CORE -->
    <text x="760" y="160" font-family="monospace" font-size="11" fill="#00f0ff" opacity="0.7">AMR1-TEC-CORE</text>
    <line x1="750" y1="168" x2="880" y2="168" stroke="#00f0ff" stroke-width="0.5" opacity="0.3"/>

    <text x="750" y="190" font-family="monospace" font-size="9" fill="#475569">MCU</text>
    <text x="790" y="190" font-family="monospace" font-size="9" fill="#94a3b8">RP2040 CAN</text>

    <text x="750" y="208" font-family="monospace" font-size="9" fill="#475569">CAN</text>
    <text x="790" y="208" font-family="monospace" font-size="9" fill="#94a3b8">500 kbps</text>

    <text x="750" y="226" font-family="monospace" font-size="9" fill="#475569">EDA</text>
    <text x="790" y="226" font-family="monospace" font-size="9" fill="#94a3b8">EasyEDA</text>

    <text x="750" y="244" font-family="monospace" font-size="9" fill="#475569">LAYERS</text>
    <text x="800" y="244" font-family="monospace" font-size="9" fill="#94a3b8">2</text>

    <line x1="750" y1="256" x2="880" y2="256" stroke="#1e3a5a" stroke-width="0.5"/>

    <text x="750" y="276" font-family="monospace" font-size="9" fill="#00f0ff" opacity="0.5">▸ VISOR 3D INTERACTIVO</text>
    <text x="750" y="292" font-family="monospace" font-size="8" fill="#475569">Rotar · Zoom · Inspeccionar</text>
  </g>

  <!-- Top label -->
  <text x="450" y="30" font-family="'Segoe UI', sans-serif" font-size="13" fill="#64748b" text-anchor="middle">AMR Autonomy and Research Lab · Tecnológico de Monterrey</text>

  <!-- Bottom CTA bar -->
  <rect x="0" y="430" width="900" height="50" fill="#0a1628" opacity="0.95"/>
  <rect x="0" y="430" width="900" height="1" fill="#00f0ff" opacity="0.2"/>
  <text x="450" y="462" font-family="'Segoe UI', sans-serif" font-size="14" fill="#00f0ff" text-anchor="middle" filter="url(#glow)">▶  Haz clic para abrir el Visor 3D Interactivo  —  Rotar · Zoom · Inspeccionar cada componente</text>
</svg>
